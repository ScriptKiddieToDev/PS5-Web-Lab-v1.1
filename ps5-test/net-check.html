<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>PS5 Local Network Test</title>
<style>
body {
  background: #10131b;
  color: #e8edf7;
  font: 22px monospace;
  padding: 24px;
  overflow-wrap: anywhere;
}
h1 { color: #7fc8ff; }
</style>
</head>
<body>
<h1>PS5 - Test rete locale</h1>
<pre id="out">Richiesta in corso...</pre>

<script>
(async () => {
  const out = document.getElementById('out');
  const report = {
    javascript: 'OK',
    page: location.href,
    request: 'in corso'
  };

  try {
    const response = await fetch(
      '/ping.txt?time=' + Date.now(),
      { cache: 'no-store' }
    );

    report.httpStatus = response.status;
    report.response = (await response.text()).trim();
    report.request =
      response.ok && report.response === 'PS5_LOCAL_TEST_OK'
        ? 'OK'
        : 'RISPOSTA INATTESA';
  } catch (e) {
    report.request = 'ERRORE';
    report.error = String(e);
  }

  out.textContent = JSON.stringify(report, null, 2);

  const beacon = new Image();
  beacon.src = '/beacon?result=' +
    encodeURIComponent(report.request) +
    '&time=' + Date.now();
})();
</script>
</body>
</html>
