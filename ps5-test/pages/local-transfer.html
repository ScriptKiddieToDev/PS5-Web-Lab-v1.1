<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trasferimento file locale</title>
<style>
:root{color-scheme:dark;--bg:#292830;--panel:#292830;--line:#85838e;--text:#f2f0f5;--muted:#c9c6d0;--accent:#25d7e8;--error:#ffaaaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif;padding:6vh 18px}.wrap{max-width:950px;margin:0 auto;border:1px solid var(--line);padding:34px 40px 36px;min-height:74vh}h1{font-size:22px;font-weight:400;margin:0 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line)}.pathline{font-size:20px;overflow-wrap:anywhere}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:40px}.toolbar label{font-size:13px}.toolbar input[type=password]{min-width:min(320px,100%)}input,button{font:inherit;color:var(--text);background:#34323c;border:1px solid #777580;padding:6px 9px}button{cursor:pointer}button:hover,button:focus-visible{color:var(--accent);border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.connect-row{margin:12px 0}.status{min-height:20px;color:var(--muted);font-size:13px;margin:8px 0}.status.error{color:var(--error)}.crumb{color:var(--accent);text-decoration:underline;cursor:pointer}.crumb.current{color:var(--text);text-decoration:none}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{text-align:left;padding:4px 8px;vertical-align:middle}.table th{font-size:16px;border-bottom:1px solid #777580}.table td{font-size:13px}.table tbody tr:hover{background:#34323c}.table th:nth-child(2),.table td:nth-child(2){text-align:right;white-space:nowrap}.table th:nth-child(3),.table td:nth-child(3){white-space:nowrap;width:1%}.name{overflow-wrap:anywhere}.filelink{border:0;background:transparent;color:var(--accent);padding:2px 0;text-align:left}.foldername{color:var(--accent)}.warning{font-size:12px;color:var(--muted)}.token-field{max-width:220px}.hidden{display:none!important}@media(max-width:700px){body{padding:12px}.wrap{padding:18px 12px;min-height:85vh}.table th,.table td{padding:5px 3px}.table th:nth-child(3),.table td:nth-child(3){white-space:normal}.table td{font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
<div class="pathline">Indice di file:<span id="crumbs" aria-label="Percorso corrente"> / </span></div>
<div class="toolbar connect-row" id="connectRow"><label for="token">Token</label><input class="token-field" id="token" type="password" autocomplete="off" placeholder="Token del server"><button id="connect" type="button">Connetti</button><span class="warning">Memorizzato solo per questa scheda.</span></div>
<div class="toolbar" id="fileTools"><button id="newFolder" type="button" disabled>Nuova cartella</button><label id="uploadLabel">Carica file <input id="upload" type="file" multiple disabled></label><span id="mode" class="warning"></span></div>
<p id="status" class="status" role="status">Inserisci il token una volta per aprire la cartella condivisa.</p>
<table class="table"><thead><tr><th>Nome</th><th>Dimensione</th><th>Ultima modifica</th></tr></thead><tbody id="entries"><tr><td colspan="3" class="muted">Connessione richiesta.</td></tr></tbody></table>
<p class="warning">Accesso limitato alla cartella condivisa. Il token non viene salvato oltre la sessione di questa scheda.</p>
</main>
<script>
(function(){
  'use strict';
  var token=document.getElementById('token'),status=document.getElementById('status'),entries=document.getElementById('entries'),crumbs=document.getElementById('crumbs');
  var currentPath='';
  var readOnly=false;
  try{token.value=sessionStorage.getItem('localTransferToken')||'';}catch(_storageError){}
  function setStatus(message,error){status.textContent=message;status.className='status'+(error?' error':'');}
  function api(url,options){options=options||{};options.headers=Object.assign({},options.headers||{}, {'X-Transfer-Token':token.value});return fetch(url,options).then(function(response){return response.json().catch(function(){return {};}).then(function(data){if(response.status===401){token.value='';try{sessionStorage.removeItem('localTransferToken');}catch(_storageError){}document.getElementById('connectRow').classList.remove('hidden');throw new Error('Token non valido o server riavviato: inseriscilo di nuovo.');}if(!response.ok)throw new Error(data.error||('HTTP '+response.status));return data;});});}
  function encode(value){return encodeURIComponent(value);}
  function formatSize(size){if(size===null)return '—';var units=['B','KiB','MiB','GiB'],i=0;while(size>=1024&&i<units.length-1){size/=1024;i++;}return (i?size.toFixed(1):size)+' '+units[i];}
  function formatModified(seconds){if(!seconds)return '—';var d=new Date(seconds*1000),p=function(n){return ('0'+n).slice(-2);};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+p(d.getFullYear()%100)+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
  function renderCrumbs(path){crumbs.textContent='';var root=document.createElement('span');root.textContent='/';root.className=path?'crumb':'crumb current';root.onclick=function(){openPath('');};crumbs.appendChild(root);var soFar='';path.split('/').filter(Boolean).forEach(function(part){soFar=soFar?soFar+'/'+part:part;crumbs.appendChild(document.createTextNode(' / '));var node=document.createElement('span');node.textContent=part;node.className=soFar===path?'crumb current':'crumb';var target=soFar;node.onclick=function(){openPath(target);};crumbs.appendChild(node);});}
  function openPath(path){currentPath=path;setStatus('Caricamento…');api('/api/list?path='+encode(path)).then(function(data){currentPath=data.path;renderCrumbs(data.path);entries.textContent='';if(!data.entries.length){var empty=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=3;cell.textContent='Cartella vuota';cell.className='muted';empty.appendChild(cell);entries.appendChild(empty);}data.entries.forEach(function(item){var row=document.createElement('tr'),name=document.createElement('td'),size=document.createElement('td'),modified=document.createElement('td');name.className='name';if(item.directory){var link=document.createElement('button');link.type='button';link.className='filelink foldername';link.textContent='📁 '+item.name;link.onclick=function(){openPath(currentPath?currentPath+'/'+item.name:item.name);};name.appendChild(link);size.textContent='';}else{var download=document.createElement('button');download.type='button';download.className='filelink';download.textContent='📄 '+item.name;download.onclick=function(){downloadFile(currentPath?currentPath+'/'+item.name:item.name);};name.appendChild(download);size.textContent=formatSize(item.size);}modified.textContent=formatModified(item.modified);row.appendChild(name);row.appendChild(size);row.appendChild(modified);entries.appendChild(row);});setStatus(data.entries.length+' elementi.');}).catch(function(error){setStatus(error.message,true);});}
  function connect(){if(!token.value){setStatus('Inserisci il token del server.',true);return;}try{sessionStorage.setItem('localTransferToken',token.value);}catch(_storageError){}api('/api/config').then(function(config){readOnly=!!config.readOnly;document.getElementById('mode').textContent=readOnly?'Sola lettura':'Caricamento e download';document.getElementById('newFolder').disabled=readOnly;document.getElementById('upload').disabled=readOnly;document.getElementById('newFolder').classList.toggle('hidden',readOnly);document.getElementById('uploadLabel').classList.toggle('hidden',readOnly);document.getElementById('connectRow').classList.add('hidden');openPath('');}).catch(function(error){setStatus(error.message,true);});}
  document.getElementById('connect').onclick=connect;
  document.getElementById('newFolder').onclick=function(){var name=window.prompt('Nome della nuova cartella:');if(!name)return;api('/api/mkdir?path='+encode(currentPath)+'&name='+encode(name),{method:'POST'}).then(function(){openPath(currentPath);}).catch(function(error){setStatus(error.message,true);});};
  document.getElementById('upload').onchange=function(event){var files=Array.prototype.slice.call(event.target.files||[]);if(!files.length)return;var button=event.target;button.disabled=true;var chain=Promise.resolve();files.forEach(function(file){chain=chain.then(function(){setStatus('Caricamento '+file.name+'…');return api('/api/upload?path='+encode(currentPath)+'&name='+encode(file.name),{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:file});});});chain.then(function(){setStatus('Caricamento completato.');openPath(currentPath);}).catch(function(error){setStatus(error.message,true);}).finally(function(){button.disabled=readOnly;button.value='';});};
  function downloadFile(path){setStatus('Download in corso…');fetch('/api/file?path='+encode(path),{headers:{'X-Transfer-Token':token.value}}).then(function(response){if(response.status===401){token.value='';try{sessionStorage.removeItem('localTransferToken');}catch(_storageError){}document.getElementById('connectRow').classList.remove('hidden');throw new Error('Token non valido o server riavviato: reinseriscilo.');}if(!response.ok)return response.json().then(function(data){throw new Error(data.error||'Download non riuscito');});return response.blob();}).then(function(blob){var url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=path.split('/').pop();link.click();setTimeout(function(){URL.revokeObjectURL(url);},30000);setStatus('Download avviato.');}).catch(function(error){setStatus(error.message,true);});}
  if(token.value)connect();
}());
</script>
</body>
</html>
