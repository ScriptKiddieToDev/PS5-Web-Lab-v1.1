<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>PS5 Worker Check</title>
<style>
body {
  background: #10131b;
  color: #e8edf7;
  font: 21px monospace;
  padding: 24px;
  overflow-wrap: anywhere;
}
h1 { color: #7fc8ff; }
</style>
</head>
<body>
<h1>PS5 Worker Check</h1>
<pre id="out">Avvio del test...</pre>
<script>
const out = document.getElementById("out");
const report = {
  javascript: "OK",
  worker: "IN ATTESA"
};

function render() {
  out.textContent = JSON.stringify(report, null, 2);
}

try {
  const worker = new Worker("/worker-check.js");

  worker.onmessage = function (event) {
    report.worker = event.data.status;
    report.reply = event.data;
    worker.terminate();
    render();
  };

  worker.onerror = function (event) {
    report.worker = "ERRORE";
    report.error = event.message || "Worker non avviato";
    worker.terminate();
    render();
  };

  worker.postMessage("PS5_WORKER_OK");
  render();

  setTimeout(function () {
    if (report.worker === "IN ATTESA") {
      report.worker = "TIMEOUT";
      worker.terminate();
      render();
    }
  }, 4000);

} catch (error) {
  report.worker = "ERRORE";
  report.error = String(error);
  render();
}
</script>
</body>
</html>
